[project]
name = "prism-reproduction"
version = "0.1.0"
description = "CPU-only claim-by-claim reproduction of PRISM (arXiv:2601.22137)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "datasets==4.0.0",
  "marimo==0.14.17",
  "matplotlib==3.10.3",
  "numpy==2.3.1",
  "pandas==2.3.1",
  "scipy==1.16.0",
  "sympy==1.14.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
